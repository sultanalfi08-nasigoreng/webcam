<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PhotoStrip</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<header><h1><i class="fas fa-camera-retro"></i> PhotoStrip</h1><div class="subtitle">4:3 • frames • collage</div></header>
<div class="main-content">
<div class="camera-section">
<div class="camera-container"><video id="video" autoplay playsinline></video><div class="border-overlay" id="borderOverlay"></div><div class="ratio-badge">4:3</div></div>
<div class="upload-section">
<div class="upload-title"><i class="fas fa-border-all"></i> Choose frame</div>
<div class="frame-options-row" id="frameList">
<div class="frame-option active" data-frame="border1.png"><div class="frame-preview"><i class="fas fa-image"></i></div><span>Frame 1</span></div>
<div class="frame-option" data-frame="border2.png"><div class="frame-preview"><i class="fas fa-image"></i></div><span>Frame 2</span></div>
<div class="frame-option" data-frame="border3.png"><div class="frame-preview"><i class="fas fa-image"></i></div><span>Frame 3</span></div>
</div>
<div class="border-status" id="borderStatus">Frame 1</div>
</div>
<div class="controls"><button class="capture-btn" id="captureBtn"><i class="fas fa-camera"></i></button><div class="photo-counter"><span id="photoCountDisplay">0</span>/3</div></div>
</div>
<div class="sidebar">
<div class="temp-gallery">
<div class="gallery-header"><span><i class="fas fa-undo-alt"></i> Click slot retake</span><div class="slot-badges"><span class="badge" id="badge1">1</span><span class="badge" id="badge2">2</span><span class="badge" id="badge3">3</span></div></div>
<div class="slots-container">
<div class="slot-card" data-slot="0"><div class="slot-number">#1</div><div class="slot-preview"><i class="fas fa-plus-circle"></i><img id="slotImg0"></div></div>
<div class="slot-card" data-slot="1"><div class="slot-number">#2</div><div class="slot-preview"><i class="fas fa-plus-circle"></i><img id="slotImg1"></div></div>
<div class="slot-card" data-slot="2"><div class="slot-number">#3</div><div class="slot-preview"><i class="fas fa-plus-circle"></i><img id="slotImg2"></div></div>
</div>
<button class="export-btn" id="exportBtn" disabled><i class="fas fa-download"></i> Export strip</button>
</div>
<div class="collage-preview-card"><div class="upload-title"><i class="fas fa-images"></i> Preview</div><div class="collage-preview" id="collagePreview"><div class="empty-preview"><i class="fas fa-camera"></i><br/>take photos</div></div></div>
<div class="history-section"><div class="upload-title"><i class="fas fa-history"></i> History</div><div class="photo-history" id="photoHistory"></div></div>
<div class="instruction"><i class="fas fa-info-circle"></i> Pick frame → take 3 photos → click slot retake → export</div>
</div>
</div>
<div id="notification" class="notification">Ready</div>
</div>
<script src="script.js"></script>
</body>
</html>
